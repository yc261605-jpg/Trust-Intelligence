<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trust Intelligence MVP</title>
  <link rel="stylesheet" href="/shared/style.css">
  <link rel="stylesheet" href="/shared/jelly.css">
  <style>
    .hero-home { text-align: center; padding: 40px 16px 10px; }
    .hero-home h1 { font-size: 30px; }
    .hero-home p { margin-top: 10px; }
    .entry { display: block; text-decoration: none; color: inherit; transition: transform .5s var(--spring); }
    .entry:hover { transform: translateY(-4px) scale(1.01); }
    .entry .k { font-size: 12px; color: var(--brand); font-weight: 800; letter-spacing: .08em; }
  </style>
</head>
<body style="--bg-photo:url('/static/img/lounge.jpg')">
  <header class="topbar"><div id="brand"></div></header>
  <main class="wrap">
    <img src="/static/img/lounge.jpg" alt="保養廠客休室示意" style="width:100%;height:320px;object-fit:cover;border-radius:30px;margin-top:8px;box-shadow:0 18px 40px rgba(20,35,55,.18)">
    <p class="faint mt-s">概念示意｜AI 生成影像，非 TOYOTA 真實場景</p>
    <div class="hero-home">
      <h1>讓每一次維修建議都有依據</h1>
      <p class="muted">包括清楚告訴你「今天不用換」</p>
    </div>
    <div class="grid3 mt">
      <a class="card entry" href="/a/"><div class="k">STEP 1</div><h2 class="mt-s">管理平台</h2>
        <p class="muted small">接待建單與專屬 QR、專員說明稿、轉接真人、回廠提醒、零件與規則</p></a>
      <a class="card entry" href="/t/"><div class="k">STEP 2</div><h2 class="mt-s">技師端</h2>
        <p class="muted small">輸入公里數、量測、拍照與原因，送出決策卡；施工進度回報</p></a>
      <a class="card entry" href="/c/"><div class="k">STEP 3</div><h2 class="mt-s">車主端</h2>
        <p class="muted small">掃專屬 QR、確認車牌；看檢查進度與決策卡、問 AI、追蹤施工</p></a>
    </div>
  </main>
  <script src="/shared/api.js"></script>
  <script>document.getElementById("brand").innerHTML = brandHtml("AI 售後服務體驗層"); document.body.insertAdjacentHTML("beforeend", FOOTER); stagger(document.querySelector(".grid3"));</script>
</body>
</html>
