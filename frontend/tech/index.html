<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trust Intelligence｜技師端</title>
  <link rel="stylesheet" href="/shared/style.css">
  <link rel="stylesheet" href="/shared/jelly.css">
  <style>
    .order-card { cursor: pointer; transition: transform .15s, box-shadow .15s; display: flex; gap: 14px; align-items: center; }
    .order-card:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(15,25,40,.1); }
    .order-card.flash { box-shadow: var(--shadow), 0 0 0 3px var(--ink); }
    .order-card > img { width: 96px; height: 72px; border-radius: 14px; object-fit: cover; flex: none; }
    .plate { display: inline-block; border: 1.5px solid var(--ink); border-radius: 8px; padding: 0 9px; font-weight: 800; letter-spacing: .05em; }

    /* 檢查：左側步驟、右側單項大卡 */
    .insp { display: grid; grid-template-columns: 290px 1fr; gap: 16px; align-items: start; }
    .steps-nav { position: sticky; top: 84px; padding: 10px; }
    .step { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 14px; cursor: pointer; font-weight: 700; font-size: 14.5px; }
    .step:hover { background: #f3f5f7; }
    .step.on { background: var(--ink); color: #fff; }
    .step img { width: 32px; height: 32px; border-radius: 9px; object-fit: cover; }
    .step .st { margin-left: auto; width: 20px; height: 20px; border-radius: 50%; border: 2px solid #cfd5dc; flex: none; }
    .step .st.immediate { background: var(--red); border-color: var(--red); }
    .step .st.deferrable { background: #d08a00; border-color: #d08a00; }
    .step .st.normal { background: var(--green); border-color: var(--green); }
    .step.on .st:not(.immediate):not(.deferrable):not(.normal) { border-color: rgba(255,255,255,.6); }
    .step.auto { font-weight: 500; font-size: 13.5px; color: var(--ink-2); cursor: default; }
    .step.auto:hover { background: none; }

    .big-card { padding: 24px; }
    .big-card .head { display: flex; align-items: center; gap: 14px; }
    .big-card .head img { width: 72px; height: 72px; border-radius: 18px; object-fit: cover; }
    .shoot { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 18px; }
    .shoot label { position: relative; overflow: hidden; width: 116px; height: 116px; border: 2px dashed #c5ccd5; border-radius: 18px; background: #f6f8fa;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; color: var(--ink-2); font-weight: 700; }
    .shoot label input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .shoot img { width: 116px; height: 116px; object-fit: cover; border-radius: 18px; cursor: zoom-in; }
    .measure-in { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
    .measure-in .input { font-size: 34px; font-weight: 800; width: 180px; text-align: center; border-radius: 18px; }
    .measure-in .unit { font-size: 22px; font-weight: 700; color: var(--ink-2); }
    .pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; background: #eef1f4; padding: 6px; border-radius: 20px; }
    .pick button { padding: 16px 10px; border-radius: 15px; border: 0; background: transparent; font-weight: 800; font-size: 17px; cursor: pointer; color: var(--ink-2); }
    .pick button.on { box-shadow: 0 1px 3px rgba(15,25,40,.15); }
    .pick button.on[data-v=normal] { background: var(--green-bg); color: var(--green); box-shadow: inset 0 0 0 2px var(--green-mid); }
    .pick button.on[data-v=suggest] { background: var(--amber-bg); color: var(--amber); box-shadow: inset 0 0 0 2px var(--amber-mid); }
    .pick button.on[data-v=must] { background: var(--red-bg); color: var(--red); box-shadow: inset 0 0 0 2px var(--red-mid); }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .chips button { border: 0; background: #eef1f4; border-radius: 999px; padding: 7px 13px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
    .chips button:hover { background: #e2e7ec; }
    .result { margin-top: 16px; padding: 12px 14px; border-radius: 16px; background: #f4f6f8; display: flex; gap: 10px; align-items: center; }
    .km-in .input { font-size: 40px; font-weight: 800; width: 260px; text-align: center; border-radius: 18px; }
    .auto-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid #edf0f3; font-size: 14.5px; }
    .auto-row img { width: 34px; height: 34px; border-radius: 9px; object-fit: cover; }

    /* 手機／小平板：步驟改成上方可橫向滑動的一排，不再蓋住內容 */
    @media (max-width: 820px) {
      .wrap { padding: 12px; }
      .topbar { padding: 10px 14px; }
      .insp { grid-template-columns: minmax(0, 1fr); gap: 12px; }
      .insp > * { min-width: 0; }
      .steps-nav { position: sticky; top: 62px; z-index: 15; display: flex; align-items: center; gap: 6px; overflow-x: auto;
        padding: 6px; margin-bottom: 0; border-radius: 22px; background: rgba(255, 255, 255, .9);
        -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); scrollbar-width: none; }
      .steps-nav::-webkit-scrollbar { display: none; }
      .steps-nav .step { flex: none; padding: 6px 10px 6px 6px; font-size: 13.5px; white-space: nowrap; gap: 6px; border-radius: 16px; }
      .steps-nav .step img { width: 26px; height: 26px; border-radius: 8px; }
      .steps-nav .step .st { margin-left: 2px; width: 14px; height: 14px; }
      .steps-nav .step.auto { display: none; }
      .steps-nav > .mt { order: -1; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 4px 0 2px !important; margin: 0; }
      .steps-nav > .mt .faint { margin: 0; white-space: nowrap; font-size: 12.5px; }
      .steps-nav > .mt .btn.block { width: auto; padding: 8px 14px; font-size: 13.5px; }
      .big-card { padding: 18px; }
      .big-card .head img { width: 56px; height: 56px; }
      .km-in { flex-wrap: nowrap; }
      .km-in .input { width: 100%; max-width: 230px; font-size: 32px; }
      .measure-in .input { width: 150px; font-size: 28px; }
      .shoot label, .shoot img { width: 92px; height: 92px; }
      .pick button { padding: 12px 6px; font-size: 15px; }
      .big-card > .row.between:last-child, .big-card .row.between { flex-wrap: wrap; gap: 10px; }
      .order-card > img { width: 72px; height: 56px; }
    }
  </style>
</head>
<body class="staff">
  <header class="topbar">
    <div id="brand"></div>
    <div class="spacer"></div>
    <button class="btn sm" onclick="showList()">工單列表</button>
  </header>
  <main id="app" class="wrap"></main>
  <script src="/shared/api.js"></script>
  <script>document.getElementById("brand").innerHTML = brandHtml("技師端");</script>
  <script src="app.js"></script>
</body>
</html>
